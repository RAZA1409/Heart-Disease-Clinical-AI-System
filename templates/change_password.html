<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | Clinical AI System</title>

    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0b1329;
            color: #f8fafc;
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.12), transparent 70%);
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }

        .password-card {
            width: 100%;
            max-width: 460px;
            background: #1e293b;
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 20px;
            padding: 40px 36px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
            position: relative;
            z-index: 2;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 26px;
        }

        .brand-icon {
            width: 50px;
            height: 50px;
            margin: 0 auto 12px;
            background: rgba(37, 99, 235, 0.15);
            border: 1px solid rgba(37, 99, 235, 0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .brand-header h1 {
            font-size: 20px;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.4;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.5;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #34d399;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            background: #0f172a;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 10px;
            color: #f8fafc;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
            background: #111c38;
        }

        .field-hint {
            font-size: 11px;
            color: #64748b;
            margin-top: 4px;
        }

        .toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
            transition: color 0.2s ease;
        }

        .toggle-btn:hover {
            color: #f8fafc;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        }

        .submit-btn:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.45);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .back-link-wrapper {
            text-align: center;
            margin-top: 22px;
        }

        .back-link {
            color: #60a5fa;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #93c5fd;
            text-decoration: underline;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            font-size: 11px;
            color: #64748b;
        }

        @media (max-width: 480px) {
            .password-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

<div class="password-card">

    <div class="brand-header">
        <div class="brand-icon">&#x1F510;</div>
        <h1>Change Password</h1>
        <div class="subtitle">Update account credentials for active clinical administrator session.</div>
    </div>

    {% if error %}
        <div class="alert alert-error">
            &#x26A0;&#xFE0F; {{ error }}
        </div>
    {% endif %}

    {% if success %}
        <div class="alert alert-success">
            &#x2713; {{ success }}
        </div>
    {% endif %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label class="form-label" for="current_password">Current Password</label>
            <div class="input-wrapper">
                <input type="password" id="current_password" name="current_password" class="form-input" required placeholder="Enter current password" autocomplete="current-password">
                <button type="button" class="toggle-btn" onclick="toggleVisibility('current_password', this)">Show</button>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="new_password">New Password</label>
            <div class="input-wrapper">
                <input type="password" id="new_password" name="new_password" class="form-input" required minlength="8" placeholder="Enter new password (min. 8 characters)" autocomplete="new-password">
                <button type="button" class="toggle-btn" onclick="toggleVisibility('new_password', this)">Show</button>
            </div>
            <div class="field-hint">Must contain at least 8 characters</div>
        </div>

        <button type="submit" class="submit-btn">
            Update Password
        </button>
    </form>

    <div class="back-link-wrapper">
        <a href="{{ url_for('dashboard') }}" class="back-link">&#x2190; Back to Dashboard</a>
    </div>

    <div class="footer">
        Heart Disease Clinical AI System &bull; Account Security
    </div>

</div>

<script>
function toggleVisibility(fieldId, btn) {
    const field = document.getElementById(fieldId);
    if (field.type === "password") {
        field.type = "text";
        btn.textContent = "Hide";
    } else {
        field.type = "password";
        btn.textContent = "Show";
    }
}
</script>

</body>
</html>
