<!DOCTYPE html>
<html>
<head>
    <title>Heart Disease Clinical Assessment</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <a href="{{ url_for('dashboard') }}" style="display:inline-block; margin-bottom:15px; color:#2c5364; text-decoration:none; font-weight:600;">← Back to Dashboard</a>

    <h1 style="color:#315c6e;">🫀 Heart Disease Clinical Assessment</h1>

    {% if error %}
    <div style="background:rgba(239,68,68,0.15); border-left:4px solid #ef4444; padding:12px; border-radius:8px; margin:20px 0 10px; color:#b91c1c; font-size:14px;">
        ⚠️ {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/predict">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <h3 style="margin-top:25px;">Patient Information</h3>

        <div class="form-grid">

            <div class="form-group">
                <label>Patient Name</label>
                <input type="text" name="patient_name" placeholder="Full name" required>
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" name="age" min="1" max="120" placeholder="e.g. 55" required>
            </div>

            <div class="form-group">
                <label>Sex</label>
                <select name="sex">
                    <option>Male</option>
                    <option>Female</option>
                </select>
            </div>

        </div>

        <h3 style="margin-top:30px;">Clinical Parameters</h3>

        <div class="form-grid">

            <div class="form-group">
                <label>Chest Pain Type</label>
                <select name="cp">
                    <option>Typical Angina</option>
                    <option>Atypical Angina</option>
                    <option>Non-Anginal Pain</option>
                    <option>Asymptomatic</option>
                </select>
            </div>

            <div class="form-group">
                <label>Resting Blood Pressure (mmHg)</label>
                <input type="number" name="trestbps" min="50" max="300" placeholder="e.g. 130" required>
            </div>

            <div class="form-group">
                <label>Serum Cholesterol (mg/dl)</label>
                <input type="number" name="chol" min="50" max="700" placeholder="e.g. 240" required>
            </div>

            <div class="form-group">
                <label>Fasting Blood Sugar > 120 mg/dl</label>
                <select name="fbs">
                    <option>No</option>
                    <option>Yes</option>
                </select>
            </div>

            <div class="form-group">
                <label>Resting ECG Results</label>
                <select name="restecg">
                    <option>Normal</option>
                    <option>ST-T Abnormality</option>
                    <option>Left Ventricular Hypertrophy</option>
                </select>
            </div>

            <div class="form-group">
                <label>Maximum Heart Rate Achieved (bpm)</label>
                <input type="number" name="thalach" min="40" max="250" placeholder="e.g. 150" required>
            </div>

            <div class="form-group">
                <label>Exercise Induced Angina</label>
                <select name="exang">
                    <option>No</option>
                    <option>Yes</option>
                </select>
            </div>

            <div class="form-group">
                <label>ST Depression (mm)</label>
                <input type="number" step="0.1" name="oldpeak" min="0" max="10" placeholder="e.g. 1.0" required>
            </div>

            <div class="form-group">
                <label>Slope of Peak Exercise ST</label>
                <select name="slope">
                    <option>Upsloping</option>
                    <option>Flat</option>
                    <option>Downsloping</option>
                </select>
            </div>

            <div class="form-group">
                <label>Number of Major Vessels (0–3)</label>
                <input type="number" name="ca" min="0" max="3" placeholder="0, 1, 2, or 3" required>
            </div>

            <div class="form-group">
                <label>Thalassemia</label>
                <select name="thal">
                    <option>Normal</option>
                    <option>Fixed Defect</option>
                    <option>Reversible Defect</option>
                </select>
            </div>

        </div>

        <button type="submit" class="submit-btn">Analyze Patient</button>

    </form>

</div>

<div class="footer">
    © 2026 Heart Disease Clinical AI System | Developed by Mohammed Raza
</div>

</body>
</html>
